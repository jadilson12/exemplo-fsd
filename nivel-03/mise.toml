[tools]
java = "temurin-25"
maven = "3.9"

[env]
# Provider do chat, chave e matrícula da demo ficam no .env
# (copie de .env.example). O .env está no .gitignore.
_.file = ".env"

[tasks.build]
description = "Compila o projeto"
run = "mvn -B compile"

[tasks.run]
description = "Abre a interface escolhida por INTERFACE no .env (tui, padrão, ou dev-ui)"
run = "mvn -B -q spring-boot:run"

[tasks.dev-ui]
description = "Abre a Dev UI web do Google ADK (navegador), sem mexer no INTERFACE do .env"
# --assistente.interface vira argumento de programa: maior precedência no Spring,
# vence o INTERFACE do .env sem precisar editar nada. O mise sobrescreve variável
# de ambiente simples (o "INTERFACE=... mvn" não funciona), por isso o argumento.
run = "mvn -B -q spring-boot:run -Dspring-boot.run.arguments=--assistente.interface=dev-ui"

[tasks.demo-offline]
description = "Roda os comandos diretos (RAG e tools) sem chamar o modelo"
run = """
printf '/buscar prazo de aproveitamento\\n/requerimentos\\n/protocolo 2026-0003\\n/sair\\n' | mvn -B -q spring-boot:run -Dspring-boot.run.arguments=--assistente.interface=tui
"""

[tasks.checar-provider]
description = "Confere se a chave está configurada e se o provider responde (não imprime a chave)"
run = """
if [ -z "$OPENAI_API_KEY" ]; then
  echo "OPENAI_API_KEY não definida — copie .env.example para .env e preencha a chave."
  exit 1
fi
echo "provider: $OPENAI_BASE_URL   modelo: $MODELO"
curl -s -o /dev/null -w "HTTP %{http_code} (200 = chave válida)\\n" \
  -H "Authorization: Bearer $OPENAI_API_KEY" "$OPENAI_BASE_URL/models"
"""
